# token-market v3 — experiment settings for run_experiments.py (A cost curves, C fraud/audit threshold,
# D baseline comparison, B long-math market). Inherits default.yaml.
extends: default.yaml

run:
  n_tasks: 480              # 6 permutations of the 80-task synthetic pool per run
  n_rounds: 48              # a round = one epoch of the strategic seller (it re-chooses q every round)

fraud:
  strategy: learning        # the STRATEGIC (learning) model-swap seller faces every policy

experiments:
  seeds: [0, 1, 2]
  log_dir: results/experiments          # per-experiment transaction logs (gitignored)
  C:
    policy: single_best_compliant       # the buyer policy that routes most demand to the swap seller
    audit_rates: [0.0, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5]
    penalties: [0.02, 0.1, 0.5]         # cheap -> harsh stake slash per detected swap
    run: {n_tasks: 960, n_rounds: 96}   # longer horizon: the seller learns from rare, large penalties
    budget_multiplier: 12.0             # budgets never bind here (isolate the audit/penalty game)
    q_threshold: 0.1                    # "swapping unprofitable" once the learned swap rate is below this
  D:
    policies: [single_cheapest_compliant, single_best_compliant, cascade_compliant, vote_k_compliant,
               compliance_unaware_cheapest, pilot, pilot_compliant, stageroute, stageroute_compliant,
               audited_compliance_cascade]
    budget_multiplier: 2.0             # 480 tasks/run = 2x v2's 240 -> 2x budget = v2's budget per task
  A:
    budget_multipliers: [0.2, 0.4, 0.6, 1.0, 1.5, 2.0, 3.0, 5.0]
    budget_policies: [single_cheapest_compliant, single_best_compliant, cascade_compliant, pilot,
                      pilot_compliant, stageroute, stageroute_compliant, audited_compliance_cascade]
    knob_budget_multiplier: 5.0          # knob sweeps (cascade threshold, vote k, D3 audit rate) at a loose budget
    cascade_thresholds: [0.1, 0.3, 0.5, 0.7, 0.8, 0.95]
    vote_k: [1, 2, 3]
    d3_audit_rates: [0.02, 0.05, 0.1, 0.2, 0.3]
  B:
    config: configs/long_math.yaml
    tight_budget_multiplier: 0.5         # vs 3.0 in long_math.yaml: makes budgets bind
