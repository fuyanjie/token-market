# Fixed-seed benchmark protocol (mock backend). Extends repo default; v6 switches OFF.
extends: ../default.yaml

run:
  seeds: [0, 1, 2]
  n_tasks: 120
  n_rounds: 10

market:
  feedback: {mode: immediate, delay_L: 0, reveal_prob: 1.0}
  audited:
    audit_rate: 0.1
    reputation_rounds: 0
    adaptive_audit: false
    escrow: false

fraud:
  strategy: learning
  attack_modes_enabled: [swap, theft]

benchmark:
  seeds: [0, 1, 2]
  primary_metrics: [active_attack_rate, fraud_share]
  secondary_metrics: [J, learned_q]
  note: "Immediate-feedback J is NOT the primary ranking."
  tasks:
    T1: {name: fixed_audit_deterrence, a: 0.1, pi: 1.0, L: 0}
    T2: {name: sparse_label_regime, pi_grid: [1.0, 0.2, 0.1, 0.05, 0.0], L: 0}
    T3: {name: adaptive_audit_same_budget, a: 0.1, adaptive: true, primary_board: false}
