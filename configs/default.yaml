# token-market v2 sandbox — default configuration
# All numbers are synthetic. Compliance rules are SIMPLIFIED SIMULATIONS, NOT LEGAL ADVICE.

run:
  seeds: [0, 1, 2]
  n_tasks: 240            # task instances per run, drawn from the FIXED task pool (3 permutations of 80)
  n_rounds: 10
  results_dir: results
  log_file: transactions.jsonl
  cache_file: cache/llm_outputs.jsonl

# Fixed task pool used with real models. Depends ONLY on task_seed (never on run seeds) so the output
# cache always hits; run seeds change sampling order, buyer assignment, sensitivity, bids, noise.
task_pool:
  kind: synthetic         # synthetic (80 generated short tasks) | long_math (data/long_tasks.jsonl) | mixed (both)
  size: 80
  task_seed: 1234
  long_path: data/long_tasks.jsonl

market:
  # C2 portfolio-purchasing policies (all run under posted_price)
  policies: [single_cheapest_compliant, single_best_compliant, cascade_compliant, vote_k_compliant,
             compliance_unaware_cheapest]
  # mechanism comparison: these single-seller policies also run under the sealed-bid auction
  mechanisms: [posted_price, sealed_bid]
  auction_policies: [single_cheapest_compliant, single_best_compliant, compliance_unaware_cheapest]
  unaware_gateway_mode: audit_only   # audit_only: violating flows pass but are logged violation=true | enforce
  cascade:
    confidence_threshold: 0.7        # stop escalating once the purchased answer's confidence >= threshold
    max_steps: 3
  vote:
    k: 3                             # buy up to k compliant sellers' answers, majority vote
  mock_confidence: {correct_mean: 0.75, wrong_mean: 0.45, std: 0.15}
  budget_multiplier: 1.0             # v3: scales every buyer budget (cost-curve / tight-budget sweeps)
  # v3 buyer audits (identity check of a purchase, see tokenmarket/strategic.py). `rate` applies to every
  # policy except audited_compliance_cascade, which uses audited.audit_rate. Cost is charged to the buyer budget.
  # v4: `types` = checks run on an audited purchase (identity = model-swap check, length = token-theft check);
  # one audit fee per audited purchase whatever the checks.
  audit: {rate: 0.0, cost: 0.004, types: [identity]}
  audited:                           # D3 = OUR policy: compliance filter + budget + cascade + audits + trust
    audit_rate: 0.1
    audit_types: [identity, length]  # v4: D3 also length-audits (token theft)
    theft_quality_factor: 0.5        # v4: D3 prior: a truncated answer is 0.5x as likely correct (routing)
    cascade: {confidence_threshold: 0.7, max_steps: 3}
  joint: {lambda: 1.0, mu: 0.5}      # v4 joint objective J = acc - lambda*violation_rate - mu*fraud_share
  pilot: {alpha: 0.5, prior_lambda: 5.0, n_bins: 4}       # D1 (LinUCB + ON-MCKP ZCL); lb/ub: auto
  stageroute: {gamma: 0.5, budget_scale: 1.0}             # D2 (per-query LP, b = budget_scale * B / T)
  auction:
    format: second_price  # second_price | first_price
    markup_low: 1.10      # bid = cost_per_1k * U(markup_low, markup_high)
    markup_high: 1.80
    reserve_price_per_1k: 0.30    # buyer-side max acceptable price (also price paid by a sole bidder in second-price)

# Model catalog.
#  - Qwen/* are REAL local models (backend local_hf). `accuracy` / `tokens_mean` here are only PRIORS used
#    (a) as the public reputation before the precompute stage has measured them and (b) as the MockLLM
#    profile under --backend-override mock. With the cache present, reputation = measured accuracy by
#    difficulty and advertised tokens = measured mean reasoning tokens (results/model_accuracy.md).
#  - sim-* are simulated (MockLLM) models; accuracy = P(correct) by difficulty (1=easy .. 3=hard).
models:
  # difficulty 4 = GSM8K-hard, 5 = MATH-500 level>=3 (v3 long tasks; priors only, measured values override)
  Qwen/Qwen2.5-1.5B-Instruct:
    accuracy: {1: 0.95, 2: 0.85, 3: 0.70, 4: 0.55, 5: 0.35}
    tokens_mean: 150
    tokens_std: 45
  Qwen/Qwen2.5-0.5B-Instruct:
    accuracy: {1: 0.80, 2: 0.55, 3: 0.35, 4: 0.25, 5: 0.15}
    tokens_mean: 140
    tokens_std: 50
  sim-fast-mock:
    accuracy: {1: 0.82, 2: 0.62, 3: 0.40, 4: 0.30, 5: 0.20}
    tokens_mean: 100          # MockLLM draws N(tokens_mean * (0.6 + 0.3*difficulty), tokens_std)
    tokens_std: 35
  # v1 simulated models (still usable in custom configs)
  sim-strong-r1:
    accuracy: {1: 0.97, 2: 0.92, 3: 0.85}
    tokens_mean: 1400
    tokens_std: 300
  sim-mid-r1:
    accuracy: {1: 0.92, 2: 0.82, 3: 0.68}
    tokens_mean: 1000
    tokens_std: 250
  sim-weak-r1:
    accuracy: {1: 0.80, 2: 0.58, 3: 0.35}
    tokens_mean: 550
    tokens_std: 150

# latency: mock sellers sample N(mean_ms, std_ms). local_hf sellers: latency = mean_ms (jurisdiction /
# network overhead) + measured gen_time_s * 1000 * backends.local_hf.latency_scale + N(0, std_ms); all +
# gateway corridor penalty; floored at 50 ms.
sellers:
  - id: seller_cn
    jurisdiction: CN
    backend: local_hf
    claimed_model: Qwen/Qwen2.5-1.5B-Instruct
    actual_model: Qwen/Qwen2.5-1.5B-Instruct
    price_per_1k: 0.20           # posted price per 1K reasoning tokens (USD, synthetic)
    cost_per_1k: 0.12            # marginal serving cost of the ACTUAL model
    latency: {mean_ms: 150, std_ms: 60}
    capacity_per_round: 20
    flags: [br_scc]
  - id: seller_sg                # MODEL-SWAP FRAUD: claims 1.5B, actually serves 0.5B (both real)
    jurisdiction: SG
    backend: local_hf
    claimed_model: Qwen/Qwen2.5-1.5B-Instruct
    actual_model: Qwen/Qwen2.5-0.5B-Instruct   # the model served when swapping
    price_per_1k: 0.18           # slightly below seller_cn
    cost_per_1k: 0.05            # serving cost when swapping (0.5B)
    strategy:                    # v3: what it serves when NOT swapping (see `fraud:` below)
      honest_model: Qwen/Qwen2.5-1.5B-Instruct
      honest_cost_per_1k: 0.12
    latency: {mean_ms: 100, std_ms: 40}
    capacity_per_round: 20
    flags: [cn_standard_contract, br_scc]
  - id: seller_br                # fast / cheap simulated model
    jurisdiction: BR
    backend: mock
    claimed_model: sim-fast-mock
    actual_model: sim-fast-mock
    price_per_1k: 0.06
    cost_per_1k: 0.03
    latency: {mean_ms: 400, std_ms: 120}
    capacity_per_round: 20
    flags: [sg_contractual_safeguards]

# budget: per run, USD (synthetic). ~40 tasks/buyer/run: single cheapest ~0.4, vote-3 ~2.5 -> vote binds for some.
# sensitivity_mix: probability of each data-sensitivity tag per task
# consent_rate: probability a task carries the data subject's specific consent (used by BR-LGPD-33-VIII)
buyers:
  - id: buyer_cn_1
    jurisdiction: CN
    budget: 2.5
    value_per_correct: 0.08
    allowed_jurisdictions: [CN, SG, BR]
    sensitivity_mix: {public: 0.4, personal: 0.35, sensitive_personal: 0.15, important_data: 0.10}
    consent_rate: 0.5
  - id: buyer_cn_2
    jurisdiction: CN
    budget: 2.5
    value_per_correct: 0.10
    allowed_jurisdictions: [CN, SG, BR]
    sensitivity_mix: {public: 0.3, personal: 0.2, sensitive_personal: 0.1, important_data: 0.4}
    consent_rate: 0.5
  - id: buyer_sg_1
    jurisdiction: SG
    budget: 2.5
    value_per_correct: 0.08
    allowed_jurisdictions: [CN, SG, BR]
    sensitivity_mix: {public: 0.5, personal: 0.35, sensitive_personal: 0.15, important_data: 0.0}
    consent_rate: 0.5
  - id: buyer_sg_2
    jurisdiction: SG
    budget: 0.50                  # deliberately tight budget
    value_per_correct: 0.06
    allowed_jurisdictions: [SG, BR]
    sensitivity_mix: {public: 0.6, personal: 0.4, sensitive_personal: 0.0, important_data: 0.0}
    consent_rate: 0.5
  - id: buyer_br_1
    jurisdiction: BR
    budget: 2.0
    value_per_correct: 0.07
    allowed_jurisdictions: [CN, SG, BR]
    sensitivity_mix: {public: 0.4, personal: 0.3, sensitive_personal: 0.3, important_data: 0.0}
    consent_rate: 0.3
  - id: buyer_br_2
    jurisdiction: BR
    budget: 2.0
    value_per_correct: 0.07
    allowed_jurisdictions: [CN, SG, BR]
    sensitivity_mix: {public: 0.5, personal: 0.3, sensitive_personal: 0.2, important_data: 0.0}
    consent_rate: 0.8

# v3 / C: strategic model-swap seller. strategy: static = v2 behaviour (always swap, q = q_static = 1);
# analytic = best response q* = 1[cost_saving > a*d*(P+R)]; logit = sigmoid(gain / logit_temperature);
# learning = epsilon-greedy (or Hedge) over a q-grid on its own realised profit (run_experiments.py uses it).
fraud:
  strategy: static
  q_static: 1.0
  cost_gap_per_1k: 0.07      # serving-cost saving per 1K tokens (0.12 honest 1.5B - 0.05 swapped 0.5B)
  detect_prob: 0.9           # P(audit of a swapped answer detects the swap) - SIMULATED identity check
  penalty: 0.25              # stake slashed per detected swap (USD, synthetic)
  reputation_rounds: 0       # rounds of delisting (zero demand) after being caught
  reputation_loss: 0.0       # R used by analytic/logit seller for the delisting cost (0 when rounds = 0)
  logit_temperature: 0.002
  learning: {learner: egreedy, epsilon: 0.1, eta: 1.0}   # learner: egreedy | hedge (eta only for hedge)
  # v4: imperfect detection + token theft. detect_prob above = identity check d (miss / false-negative rate 1-d);
  # false positives are 0 for both checks (honest answers / honest bills are never flagged).
  attack_modes_enabled: [swap]   # subset of [swap, theft]; [] = honest seller_sg. Default = v3 (swap only)
  q_theft_static: 1.0            # theft probability of the static strategy (if theft enabled)
  detect_prob_length: 0.9        # P(length audit flags an over-billed purchase) - SIMULATED; miss rate 1-d_length
  billed_token_policy: claimed_mean   # claimed_mean: bill the claimed model's advertised mean tokens |
                                      # inflated_factor: bill inflated_factor x the full (untruncated) length
  inflated_factor: 2.0
  theft_max_new_tokens: 48       # a theft purchase stops generating after this many tokens (null: no truncation)
  length_audit_tol: 0.1          # flag if billed > actual * (1 + tol)
  length_audit_abs_gap: 0        # ... or billed - actual > abs_gap (0 disables)
  length_audit_reference: false  # true: compare billed with the claimed model's CACHED reference generation length

tasks:
  types: [arithmetic, word_problem, sequence, logic]
  difficulty_mix: {1: 0.4, 2: 0.4, 3: 0.2}

# Cross-border corridors "ORIGIN->DEST": latency penalty (ms) and fee/tariff rate (fraction of cost, paid by buyer).
gateway:
  default_cross_border: {latency_penalty_ms: 200, fee_rate: 0.03}
  corridors:
    CN->SG: {latency_penalty_ms: 80,  fee_rate: 0.02}
    SG->CN: {latency_penalty_ms: 80,  fee_rate: 0.02}
    CN->BR: {latency_penalty_ms: 320, fee_rate: 0.05}
    BR->CN: {latency_penalty_ms: 320, fee_rate: 0.05}
    SG->BR: {latency_penalty_ms: 280, fee_rate: 0.04}
    BR->SG: {latency_penalty_ms: 280, fee_rate: 0.04}

# ---------------------------------------------------------------------------
# Compliance rules — SIMPLIFIED SIMULATION, NOT LEGAL ADVICE.
# Evaluated in order, only for cross-border flows (buyer jurisdiction != seller jurisdiction).
#   type: allow   -> matching flow is allowed immediately (short-circuit)
#   type: require -> matching flow is allowed only if ANY allow_if condition holds, else BLOCKED with rule_id
# allow_if keys:
#   dest_in_adequacy: true   -> destination is on origin's adequacy list (compliance.adequacy)
#   seller_flags_any: [...]  -> seller holds at least one of these legal-mechanism flags
#   task_flags_all:  [...]   -> task carries all these flags (e.g. specific_consent)
# Flows matching no rule are allowed.
# ---------------------------------------------------------------------------
compliance:
  adequacy:                  # hypothetical "comparable protection / adequacy" lists, for simulation only
    SG: [BR]
    BR: []
    CN: []
  rules:
    - rule_id: GEN-PUBLIC
      description: Public (non-personal) data may flow to any jurisdiction.
      origin: ANY
      sensitivity: [public]
      type: allow
    - rule_id: CN-DSL-31
      description: Important data collected in CN may not leave CN without a security assessment.
      origin: CN
      sensitivity: [important_data]
      type: require
      allow_if: {seller_flags_any: [cn_security_assessment]}
    - rule_id: CN-PIPL-40
      description: Sensitive personal information from CN requires a CAC security assessment before export.
      origin: CN
      sensitivity: [sensitive_personal]
      type: require
      allow_if: {seller_flags_any: [cn_security_assessment]}
    - rule_id: CN-PIPL-38
      description: Personal information export from CN requires a legal mechanism (security assessment / standard contract / certification).
      origin: CN
      sensitivity: [personal]
      type: require
      allow_if: {seller_flags_any: [cn_security_assessment, cn_standard_contract, cn_certification]}
    - rule_id: SG-PDPA-26
      description: Transfer limitation obligation - personal data leaves SG only to comparable-protection jurisdictions or under contractual safeguards.
      origin: SG
      sensitivity: [personal, sensitive_personal]
      type: require
      allow_if: {dest_in_adequacy: true, seller_flags_any: [sg_contractual_safeguards]}
    - rule_id: BR-LGPD-33-VIII
      description: Sensitive personal data transferred from BR requires the data subject's specific consent (simplified).
      origin: BR
      sensitivity: [sensitive_personal]
      type: require
      allow_if: {task_flags_all: [specific_consent]}
    - rule_id: BR-LGPD-33
      description: International transfer from BR only to adequate countries, or with standard contractual clauses, or with specific consent.
      origin: BR
      sensitivity: [personal, sensitive_personal]
      type: require
      allow_if: {dest_in_adequacy: true, seller_flags_any: [br_scc], task_flags_all: [specific_consent]}

backends:
  local_hf:                  # real local models (transformers, CPU, fp32, greedy); used via the output cache
    max_new_tokens: 256
    long_max_new_tokens: 512 # v3 long math tasks (GSM8K-hard / MATH-500) use their own prompt + token limit
                             # (target was 768; benchmark: 1.5B bf16 ~0.52 s/step at batch 16 -> 768 would take
                             # ~30 min for both models, so reduced to 512 per the <=25 min budget)
    long_dtype: bfloat16     # long tasks only; the synthetic pool stays fp32 (v2 cache)
    batch_size: 16
    num_threads: 8
    latency_scale: 1.0       # multiplies measured CPU gen time per item (e.g. 0.1 to mimic GPU serving)
  real:                      # OpenAI-compatible endpoint; unused by default, no keys in repo
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY     # or DEEPSEEK_API_KEY with base_url https://api.deepseek.com/v1
    model_map:                          # simulated model name -> real endpoint model name
      sim-strong-r1: qwen-plus
      sim-mid-r1: qwen-turbo
      sim-weak-r1: qwen-turbo
      sim-fast-mock: qwen-turbo
      Qwen/Qwen2.5-1.5B-Instruct: qwen2.5-1.5b-instruct
      Qwen/Qwen2.5-0.5B-Instruct: qwen2.5-0.5b-instruct
    timeout_s: 60
